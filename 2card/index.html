<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grand Sport Menu</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="card">
        <div class="header">
            <h1>GRAND SPORT</h1>
            <p>ВЕЛИКИЙ СПОРТ - ВЕЛИКИЙ ВИБІР</p>
        </div>
        
        <div class="menu">
            <a href="#" class="menu-btn">
                <span class="icon"><i class="fa-solid fa-cart-shopping"></i></span>
                <span class="text">КАТАЛОГ</span>
            </a>
            <a href="#" class="menu-btn">
                <span class="icon"><i class="fa-solid fa-pencil"></i></span>
                <span class="text">РОЗМІРИ</span>
            </a>
            <a href="#" class="menu-btn">
                <span class="icon"><i class="fa-solid fa-arrows-rotate"></i></span>
                <span class="text">ДОСТАВКА</span>
            </a>
            <a href="#" class="menu-btn">
                <span class="icon"><i class="fa-solid fa-phone"></i></span>
                <span class="text">КОНТАКТИ</span>
            </a>
            <a href="#" class="menu-btn">
                <span class="icon"><i class="fa-solid fa-comments"></i></span>
                <span class="text">ВІДГУКИ</span>
            </a>
        </div>

        <a href="#" class="order-btn">ОФОРМИТИ ЗАМОВЛЕННЯ</a>
        <div class="footer-badge">Design by <span>SKY</span></div>
    </div>
</body>
</html>
